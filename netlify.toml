[build]
command = "npm run build"
publish = ".next"

[build.environment]
# These values are deliberately compiled into browser code. The Supabase anon
# key is public by design; the service-role key is not listed here and remains
# protected by Netlify's secret scanning.
SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
